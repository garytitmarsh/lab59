<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>The Low-Maintenance Digital Blueprint - LAB59</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* BRAND BOARD SPECIFICATIONS */
        :root {
            --bg-black: #000000;
            --surface-dark: #0e1017;
            --card-dark: #161922;
            --text-white: #FFFFFF;
            --text-slate: #97999F;
            --accent-blue: #0046FF;
            --accent-gold: #B8860B;
            --border-color: rgba(255, 255, 255, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-black);
            color: var(--text-white);
            line-height: 1.6;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        /* PAGE FORMATTING FOR PDF PRINTING */
        .pdf-page {
            width: 210mm;
            height: 297mm; /* A4 Dimensions */
            padding: 20mm;
            background-color: var(--bg-black);
            position: relative;
            page-break-after: always;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            border-bottom: 1px solid #111;
        }

        /* HEADER & FOOTER */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent-blue);
            padding-bottom: 12px;
            margin-bottom: 25px;
        }

        .brand-logo {
            font-weight: 800;
            font-size: 1.4rem;
            letter-spacing: -0.5px;
            color: var(--text-white);
        }

        .brand-logo span {
            color: var(--accent-blue);
        }

        .page-tag {
            font-size: 0.75rem;
            color: var(--text-slate);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .page-footer {
            border-top: 1px solid var(--border-color);
            padding-top: 12px;
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-slate);
        }

        /* TYPOGRAPHY */
        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        h2 {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--accent-blue);
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        p {
            color: var(--text-slate);
            font-size: 0.95rem;
            margin-bottom: 15px;
        }

        p strong, li strong {
            color: var(--text-white);
        }

        .highlight-box {
            background-color: var(--surface-dark);
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--accent-blue);
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
        }

        /* COMPARISON TABLE */
        .comparison-table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            font-size: 0.85rem;
        }

        .comparison-table th {
            background-color: var(--surface-dark);
            color: var(--text-white);
            padding: 12px;
            text-align: left;
            border: 1px solid var(--border-color);
            font-weight: 700;
        }

        .comparison-table td {
            padding: 12px;
            border: 1px solid var(--border-color);
            color: var(--text-slate);
            background-color: var(--card-dark);
        }

        .comparison-table td strong {
            color: var(--text-white);
        }

        /* WORKFLOW DIAGRAM */
        .workflow-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 25px 0;
        }

        .workflow-step {
            background: var(--card-dark);
            border: 1px solid var(--border-color);
            padding: 15px 20px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .step-num {
            background: var(--accent-blue);
            color: white;
            font-weight: 800;
            width: 32px;
            height: 32px;
